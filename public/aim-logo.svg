<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.000 0 0 0 0 0.500 0 0 0 0 1.000 0 0 0 0.85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="240">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE6F4"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D7FF"/><stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
  </defs>
  <rect width="900" height="240" fill="transparent"/>
  <text x="40" y="155" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="18" fill="url(#whiteGrad)">AIM</text>
  <circle cx="575" cy="112" r="26" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
</svg>